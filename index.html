<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CharaName BMG Tool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>CharaName BMG Tool</h1>
      <p>Create the CharaName text, BMG, UIAssets SZS, and RaceAssets SZS files for Retro Rewind custom character names.</p>
    </header>

    <section class="panel">
      <div class="grid labels">
        <span>Original character</span>
        <span>Custom ID</span>
        <span>New character name</span>
        <span>Author name</span>
        <span></span>
      </div>
      <div id="rows"></div>
      <button id="addRow" type="button">Add another name</button>
    </section>

    <section class="panel">
      <h2>Preview</h2>
      <pre id="preview">#BMG</pre>
      <div class="actions">
        <button id="generate" type="button">Generate downloads</button>
        <span id="status"></span>
      </div>
      <div id="downloads" class="downloads"></div>
    </section>
  </main>

  <template id="rowTemplate">
    <div class="grid row">
      <select class="character"></select>
      <input class="table" type="number" min="1" max="50" value="1">
      <input class="name" type="text" maxlength="80" placeholder="Mario (Fire)">
      <input class="author" type="text" maxlength="80" placeholder="Optional">
      <button class="remove" type="button">Remove</button>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
